services:
  # A Docker web service
  - type: web
    name: brewera
    runtime: python
    # Always-on paid instance — the free tier sleeps after ~15 min idle, and the
    # cold start surfaces as transient 502/500s on the first request (drove the
    # Apollo/Signals "Could not load…" failures). 'starter' is the entry always-on
    # tier; bump to standard/pro if more memory/CPU is needed. NOTE: the live
    # instance type is set in the Render dashboard (Settings → Instance Type) — this
    # field only governs Blueprint-managed deploys, so update both.
    plan: starter
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
