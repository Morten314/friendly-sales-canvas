<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Admin Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
        }

        .form-group input {
            padding: 12px 15px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 300px;
            padding: 12px 15px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-size: 14px;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .download-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .download-select {
            padding: 12px 15px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #dee2e6;
            font-size: 14px;
            color: #495057;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.1em;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-new {
            background: #d4edda;
            color: #155724;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .search-box,
            .download-group {
                width: 100%;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Registration Admin Panel</h1>
            <p>Manage and view all registrations</p>
        </div>

        <div class="content">
            <!-- Add New Registration Section -->
            <div class="section">
                <h2 class="section-title">➕ Add New Registration</h2>
                <div class="form-section">
                    <div id="addAlert" class="alert"></div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="newName">Name *</label>
                            <input type="text" id="newName" placeholder="Enter name" required>
                        </div>
                        <div class="form-group">
                            <label for="newEmail">Email *</label>
                            <input type="email" id="newEmail" placeholder="Enter email" required>
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="addRegistration()">Add Registration</button>
                </div>
            </div>

            <!-- View Registrations Section -->
            <div class="section">
                <h2 class="section-title">📊 All Registrations</h2>
                
                <div class="controls">
                    <input type="text" class="search-box" id="searchInput" placeholder="Search by name or email..." onkeyup="filterRegistrations()">
                    <div class="download-group">
                        <select class="download-select" id="downloadFormat">
                            <option value="xlsx">Download as XLSX</option>
                            <option value="csv">Download as CSV</option>
                        </select>
                        <button class="btn btn-success" onclick="downloadData()">Download</button>
                    </div>
                    <button class="btn btn-secondary" onclick="loadRegistrations()">Refresh</button>
                </div>

                <div id="alert" class="alert"></div>
                
                <div class="table-container">
                    <div id="loading" class="loading">Loading registrations...</div>
                    <div id="emptyState" class="empty-state" style="display: none;">
                        <div class="empty-state-icon">📭</div>
                        <h3>No registrations found</h3>
                        <p>Start by adding a new registration above.</p>
                    </div>
                    <table id="registrationsTable" style="display: none;">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Timestamp</th>
                            </tr>
                        </thead>
                        <tbody id="registrationsBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allRegistrations = [];
        let filteredRegistrations = [];

        // Hardcoded API base URL
        const API_BASE_URL = 'https://backend-11kr.onrender.com';

        // Load registrations on page load
        window.onload = function() {
            loadRegistrations();
        };

        // Show alert message
        function showAlert(alertId, message, type) {
            const alert = document.getElementById(alertId);
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        // Load all registrations
        async function loadRegistrations() {
            const loading = document.getElementById('loading');
            const table = document.getElementById('registrationsTable');
            const emptyState = document.getElementById('emptyState');
            const tbody = document.getElementById('registrationsBody');

            loading.style.display = 'block';
            table.style.display = 'none';
            emptyState.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE_URL}/registration`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                allRegistrations = data;
                filteredRegistrations = data;
                
                loading.style.display = 'none';
                
                if (data.length === 0) {
                    emptyState.style.display = 'block';
                } else {
                    displayRegistrations(data);
                    table.style.display = 'table';
                }
            } catch (error) {
                loading.style.display = 'none';
                showAlert('alert', `Error loading registrations: ${error.message}`, 'error');
                console.error('Error:', error);
            }
        }

        // Display registrations in table
        function displayRegistrations(registrations) {
            const tbody = document.getElementById('registrationsBody');
            tbody.innerHTML = '';

            registrations.forEach((reg, index) => {
                const row = document.createElement('tr');
                const timestamp = new Date(reg.timestamp);
                const formattedDate = timestamp.toLocaleString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${escapeHtml(reg.name)}</strong></td>
                    <td>${escapeHtml(reg.email)}</td>
                    <td>${formattedDate}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // Filter registrations by search term
        function filterRegistrations() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const table = document.getElementById('registrationsTable');
            const emptyState = document.getElementById('emptyState');

            if (searchTerm === '') {
                filteredRegistrations = allRegistrations;
            } else {
                filteredRegistrations = allRegistrations.filter(reg => 
                    reg.name.toLowerCase().includes(searchTerm) ||
                    reg.email.toLowerCase().includes(searchTerm)
                );
            }

            if (filteredRegistrations.length === 0) {
                table.style.display = 'none';
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                displayRegistrations(filteredRegistrations);
                table.style.display = 'table';
            }
        }

        // Add new registration
        async function addRegistration() {
            const name = document.getElementById('newName').value.trim();
            const email = document.getElementById('newEmail').value.trim();
            const alert = document.getElementById('addAlert');

            if (!name || !email) {
                showAlert('addAlert', 'Please fill in all fields', 'error');
                return;
            }

            // Basic email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showAlert('addAlert', 'Please enter a valid email address', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/registration`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // Clear form
                document.getElementById('newName').value = '';
                document.getElementById('newEmail').value = '';
                
                showAlert('addAlert', 'Registration added successfully!', 'success');
                
                // Reload registrations
                setTimeout(() => {
                    loadRegistrations();
                    document.getElementById('searchInput').value = '';
                }, 500);
            } catch (error) {
                showAlert('addAlert', `Error adding registration: ${error.message}`, 'error');
                console.error('Error:', error);
            }
        }

        // Download data as XLSX or CSV
        function downloadData() {
            const format = document.getElementById('downloadFormat').value;
            const data = filteredRegistrations.length > 0 ? filteredRegistrations : allRegistrations;

            if (data.length === 0) {
                showAlert('alert', 'No data to download', 'error');
                return;
            }

            // Prepare data for export
            const exportData = data.map((reg, index) => {
                const timestamp = new Date(reg.timestamp);
                return {
                    'S.No': index + 1,
                    'Name': reg.name,
                    'Email': reg.email,
                    'Timestamp': timestamp.toLocaleString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    }),
                    'Date': timestamp.toISOString().split('T')[0],
                    'Time': timestamp.toTimeString().split(' ')[0]
                };
            });

            if (format === 'xlsx') {
                downloadXLSX(exportData);
            } else {
                downloadCSV(exportData);
            }
        }

        // Download as XLSX
        function downloadXLSX(data) {
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Registrations');
            
            const timestamp = new Date().toISOString().split('T')[0];
            XLSX.writeFile(wb, `registrations_${timestamp}.xlsx`);
        }

        // Download as CSV
        function downloadCSV(data) {
            if (data.length === 0) return;

            // Get headers
            const headers = Object.keys(data[0]);
            
            // Create CSV content
            let csv = headers.join(',') + '\n';
            
            data.forEach(row => {
                const values = headers.map(header => {
                    const value = row[header];
                    // Escape commas and quotes in values
                    if (typeof value === 'string' && (value.includes(',') || value.includes('"'))) {
                        return `"${value.replace(/"/g, '""')}"`;
                    }
                    return value;
                });
                csv += values.join(',') + '\n';
            });

            // Create download link
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            
            const timestamp = new Date().toISOString().split('T')[0];
            link.setAttribute('download', `registrations_${timestamp}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Allow Enter key to submit form
        document.getElementById('newName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('newEmail').focus();
            }
        });

        document.getElementById('newEmail').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addRegistration();
            }
        });
    </script>
</body>
</html>
